<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked Cards | ABC'S</title>

    <link rel="stylesheet" href="css/linked-cards.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>

    <div class="logo">ABC'S</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main>

    <section class="cards-container">

        <div class="top-bar">

            <h1>Linked Cards</h1>

            <button
            onclick="location.href='add-card.html'">
                + Add New Card
            </button>

        </div>

        <!-- Card 1 -->

        <div class="card-box">

            <div class="card-info">

                <i class="fa-brands fa-cc-visa"></i>

                <div>

                    <h3>Visa Card</h3>

                    <p>**** **** **** 4587</p>

                </div>

            </div>

            <div class="card-actions">

                <button class="default-btn">
                    Default
                </button>

                <button
                class="remove-btn"
                onclick="removeCard(this)">
                    Remove
                </button>

            </div>

        </div>

        <!-- Card 2 -->

        <div class="card-box">

            <div class="card-info">

                <i class="fa-brands fa-cc-mastercard"></i>

                <div>

                    <h3>Mastercard</h3>

                    <p>**** **** **** 7854</p>

                </div>

            </div>

            <div class="card-actions">

                <button
                class="set-default-btn">
                    Set Default
                </button>

                <button
                class="remove-btn"
                onclick="removeCard(this)">
                    Remove
                </button>

            </div>

        </div>

    </section>

</main>

<script src="js/linked-cards.js"></script>

</body>
</html>
