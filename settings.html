<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | ABC'S</title>

    <link rel="stylesheet" href="css/settings.css">
</head>
<body>

<header>

    <div class="logo">ABC'S</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main>

    <div class="settings-container">

        <h1>Settings</h1>

        <!-- DARK MODE -->
        <div class="section">

            <h2>Appearance</h2>

            <div class="row">

                <span>Dark Mode</span>

                <label class="switch">

                    <input type="checkbox" id="darkModeToggle">

                    <span class="slider"></span>

                </label>

            </div>

        </div>

        <!-- SECURITY -->
        <div class="section">

            <h2>Security</h2>

            <button onclick="changePassword()">
                Change Password
            </button>

            <button onclick="enable2FA()">
                Enable Two-Factor Authentication
            </button>

            <button onclick="logoutAllDevices()">
                Logout All Devices
            </button>

        </div>

        <!-- ACCOUNT -->
        <div class="section">

            <h2>Account</h2>

            <button class="danger"
            onclick="deleteAccount()">
                Delete Account
            </button>

        </div>

    </div>

</main>

<script src="js/settings.js"></script>

</body>
</html>
