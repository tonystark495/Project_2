<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Settings | ABC'S Admin</title>

<link rel="stylesheet" href="css/admin-settings.css">
</head>
<body>

<div class="settings-container">

    <h1>System Settings</h1>

    <div class="setting-card">

        <h3>Platform Name</h3>

        <input type="text"
        value="ABC'S Payment Platform">

    </div>

    <div class="setting-card">

        <h3>Admin Email</h3>

        <input type="email"
        value="admin@abcs.com">

    </div>

    <div class="setting-card">

        <h3>Transaction Notifications</h3>

        <label>
            <input type="checkbox" checked>
            Enable Notifications
        </label>

    </div>

    <div class="setting-card">

        <h3>Security</h3>

        <button class="change-password">
            Change Password
        </button>

    </div>

    <button class="save-btn">
        Save Changes
    </button>

</div>

</body>
</html>
