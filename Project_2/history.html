<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | ABC'S</title>
    <link rel="stylesheet" href="css/history.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>

    <div class="logo">
        ABC'S
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="send-money.html">Send Money</a>
        <a href="receive-money.html">Receive Money</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main>

    <div class="history-container">

        <div class="top-section">

            <h1>Transaction History</h1>

            <div class="filters">

                <input
                type="text"
                id="searchInput"
                placeholder="Search transactions...">

                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                </select>

            </div>

        </div>

        <div class="table-container">

            <table id="transactionTable">

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>30/05/2026</td>
                        <td>John Smith</td>
                        <td>Sent</td>
                        <td class="negative">-$200</td>
                        <td class="completed">Completed</td>
                    </tr>

                    <tr>
                        <td>29/05/2026</td>
                        <td>Alice Johnson</td>
                        <td>Received</td>
                        <td class="positive">+$500</td>
                        <td class="completed">Completed</td>
                    </tr>

                    <tr>
                        <td>28/05/2026</td>
                        <td>Michael Brown</td>
                        <td>Sent</td>
                        <td class="negative">-$100</td>
                        <td class="pending">Pending</td>
                    </tr>

                    <tr>
                        <td>27/05/2026</td>
                        <td>Sarah Wilson</td>
                        <td>Received</td>
                        <td class="positive">+$350</td>
                        <td class="failed">Failed</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<script src="js/history.js"></script>

</body>
</html>
