<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login -  ABC'S</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">
                <h1>ABC'S</h1>
            </div>

            <h2>Log in to your account</h2>

            <form id="loginForm">

                <div class="input-group">
                    <input type="email"
                    id="email"
                    placeholder="Email address"
                    required>
                </div>

                <div class="input-group password-group">
                    <input type="password"
                    id="password"
                    placeholder="Password"
                    required>

                    <i class="fa-solid fa-eye toggle-password"></i>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit">
                    Log In
                </button>

            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <a href="signup.html" class="register-btn">
                Create an Account
            </a>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
