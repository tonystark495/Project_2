<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds | ABC'S</title>

    <link rel="stylesheet" href="css/add-funds.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>

    <div class="logo">ABC'S</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main>

    <div class="funds-card">

        <h1>Add Funds</h1>

        <p class="subtitle">
            Deposit money into your PayFlow wallet.
        </p>

        <form id="addFundsForm">

            <div class="input-group">

                <label>Amount</label>

                <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                required>

            </div>

            <div class="input-group">

                <label>Funding Method</label>

                <select id="method">

                    <option value="">
                        Select Method
                    </option>

                    <option>
                        Visa Card
                    </option>

                    <option>
                        Mastercard
                    </option>

                    <option>
                        MTN Mobile Money
                    </option>

                    <option>
                        Orange Money
                    </option>

                    <option>
                        Bank Account
                    </option>

                </select>

            </div>

            <button type="submit">
                Add Funds
            </button>

        </form>

    </div>

</main>

<script src="js/add-funds.js"></script>

</body>
</html>
