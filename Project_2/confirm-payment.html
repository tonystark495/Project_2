<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Payment | ABC'S</title>
    <link rel="stylesheet" href="css/confirm-payment.css">
</head>
<body>

    <div class="container">

        <div class="confirm-card">

            <div class="header">
                <h1>Confirm Payment</h1>
                <p>Review your transaction details.</p>
            </div>

            <div class="transaction-details">

                <div class="detail">
                    <span>Recipient</span>
                    <strong id="recipientEmail">
                        john@example.com
                    </strong>
                </div>

                <div class="detail">
                    <span>Amount</span>
                    <strong id="amount">
                        $250.00
                    </strong>
                </div>

                <div class="detail">
                    <span>Transaction Fee</span>
                    <strong>
                        $2.50
                    </strong>
                </div>

                <div class="detail total">
                    <span>Total</span>
                    <strong>
                        $252.50
                    </strong>
                </div>

            </div>

            <div class="buttons">

                <button class="cancel-btn"
                onclick="history.back()">
                    Cancel
                </button>

                <button class="confirm-btn"
                id="confirmPayment">
                    Confirm Payment
                </button>

            </div>

        </div>

    </div>

<script src="js/confirm-payment.js"></script>

</body>
</html>
