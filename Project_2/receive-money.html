<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receive Money | ABC'S</title>

    <link rel="stylesheet" href="css/receive-money.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>

    <div class="logo">
        ABC'S
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="send-money.html">Send Money</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main>

    <div class="receive-container">

        <div class="receive-card">

            <h1>Receive Money</h1>

            <p class="subtitle">
                Share your details and receive payments instantly.
            </p>

            <div class="qr-section">

                <img
                src="images/qr-code.png"
                alt="QR Code">

                <p>Scan to Pay</p>

            </div>

            <div class="info-box">

                <label>Account ID</label>

                <div class="copy-field">

                    <input
                    type="text"
                    value="AB-2026-001254"
                    id="accountId"
                    readonly>

                    <button onclick="copyText('accountId')">
                        <i class="fas fa-copy"></i>
                    </button>

                </div>

            </div>

            <div class="info-box">

                <label>Email Address</label>

                <div class="copy-field">

                    <input
                    type="text"
                    value="emmanuel@example.com"
                    id="email"
                    readonly>

                    <button onclick="copyText('email')">
                        <i class="fas fa-copy"></i>
                    </button>

                </div>

            </div>

            <div class="info-box">

                <label>Payment Link</label>

                <div class="copy-field">

                    <input
                    type="text"
                    value="https://abcs.com/pay/AB-2026-001254"
                    id="paymentLink"
                    readonly>

                    <button onclick="copyText('paymentLink')">
                        <i class="fas fa-copy"></i>
                    </button>

                </div>

            </div>

            <button class="share-btn">
                <i class="fas fa-share"></i>
                Share Payment Link
            </button>

        </div>

    </div>

</main>

<script src="js/receive-money.js"></script>

</body>
</html>
